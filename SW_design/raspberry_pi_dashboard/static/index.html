<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASM Pocket Museum Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div id="app" class="container-fluid">
        <header class="py-3 mb-4 border-bottom">
            <h1 class="text-center">BASM Pocket Museum Dashboard</h1>
        </header>

        <!-- Tab Navigation -->
        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="welcome-tab" data-bs-toggle="tab" data-bs-target="#welcome" type="button" role="tab">
                    Welcome
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="data-tab" data-bs-toggle="tab" data-bs-target="#data" type="button" role="tab">
                    Pocket Lab Data
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="notebook-tab" data-bs-toggle="tab" data-bs-target="#notebook" type="button" role="tab">
                    Notebook
                </button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="mainTabsContent">
            <!-- Welcome Tab -->
            <div class="tab-pane fade show active" id="welcome" role="tabpanel">
                <div class="py-5">
                    <h2 class="text-center mb-4">Welcome to BASM Pocket Museum</h2>
                    <div id="welcome-content" class="text-center">
                        <!-- Content will be dynamically loaded by welcome.js -->
                        <p>Loading...</p>
                    </div>
                </div>
            </div>

            <!-- Pocket Lab Data Tab -->
            <div class="tab-pane fade" id="data" role="tabpanel">
                <div class="py-4">
                    <h2 class="mb-4">Active Pocket Labs</h2>
                    <div id="device-list" class="row">
                        <!-- Device cards will be dynamically loaded by data-tab.js -->
                    </div>
                    <hr class="my-4">
                    <div id="sensor-display">
                        <!-- Sensor charts/displays will appear here -->
                    </div>
                </div>
            </div>

            <!-- Notebook Tab -->
            <div class="tab-pane fade" id="notebook" role="tabpanel">
                <div class="py-4">
                    <h2 class="mb-4">Pocket Lab Notebook</h2>
                    <div id="questions-container">
                        <!-- Questions will be dynamically loaded by notebook.js -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="/js/app.js"></script>
    <script src="/js/welcome.js"></script>
    <script src="/js/data-tab.js"></script>
    <script src="/js/notebook.js"></script>
    <script src="/js/charts.js"></script>
</body>
</html>
