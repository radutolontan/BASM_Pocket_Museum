# Nginx configuration for Pocket Lab Dashboard
# Place this file in: /etc/nginx/sites-available/pocketlab
# Then symlink to: /etc/nginx/sites-enabled/pocketlab

# Map for WebSocket upgrade support
# When Upgrade header is present, set Connection to "upgrade"
# When Upgrade header is empty, set Connection to "close"
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Redirect HTTP to HTTPS (optional, enable if you add SSL)
# server {
#     listen 80;
#     server_name pocketlab.local pocketlab;
#     return 301 https://$server_name$request_uri;
# }

# Main server block
server {
    listen 80;
    server_name pocketlab.local pocketlab _;  # Accept pocketlab.local, pocketlab, or IP address

    # Max upload size (for data export/import)
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/pocketlab_access.log;
    error_log /var/log/nginx/pocketlab_error.log;

    # Root location - proxy to Flask app
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket support for SocketIO
    # This handles both WebSocket upgrades and Socket.IO polling
    location /socket.io {
        proxy_pass http://127.0.0.1:8080/socket.io;
        proxy_http_version 1.1;
        proxy_buffering off;

        # Support both polling and WebSocket transports
        # Use map directive to set Connection header appropriately
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers for Socket.IO polling (especially for iOS)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Static files (optional - Flask can serve these, but Nginx is more efficient)
    location /static {
        alias /home/basm/code/BASM_Pocket_Museum/SW_design/raspberry_pi_dashboard/static;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
}
