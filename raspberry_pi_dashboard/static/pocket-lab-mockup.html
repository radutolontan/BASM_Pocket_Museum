<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Lab Data - Mockup</title>

    <!-- Google Fonts - Work Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/css/pocket-lab-mockup.css">
</head>
<body data-theme="light">
    <div class="container">
        <!-- Header -->
        <header class="mockup-header">
            <div class="header-content">
                <h1>Pocket Lab Data</h1>
                <p class="subtitle">Real-time sensor visualization</p>
            </div>
            <button id="themeToggle" class="theme-toggle-btn">
                <i class="bi bi-moon-fill"></i>
                <span>Dark Theme</span>
            </button>
        </header>

        <!-- Step 1: Device Selection View -->
        <section id="deviceSelectionView" class="view active">
            <h2 class="section-title">Select a Pocket Lab</h2>
            <p class="section-description">Choose which device you want to view data from</p>

            <div id="deviceGrid" class="device-grid">
                <!-- Devices will be generated by JS -->
            </div>
        </section>

        <!-- Step 2 & 3: Measurement Selection & Display View -->
        <section id="measurementView" class="view">
            <!-- Selected Device Info -->
            <div class="selected-device-banner">
                <div class="banner-content">
                    <i class="bi bi-cpu-fill"></i>
                    <div>
                        <h3 id="selectedDeviceName">ESP32-01</h3>
                        <p id="selectedDeviceId">LAB_01</p>
                    </div>
                </div>
                <button id="changeDeviceBtn" class="btn btn-outline-blue">
                    <i class="bi bi-arrow-left"></i>
                    Change Device
                </button>
            </div>

            <!-- Measurement Type Cards -->
            <h2 class="section-title">Select Measurements to Display</h2>
            <p class="section-description">Click on display options to add sensor visualizations below</p>

            <div class="measurement-grid" id="measurementGrid">
                <!-- Measurement cards will be generated by JS -->
            </div>

            <!-- Active Display Cards -->
            <div id="displaySection" style="display: none;">
                <hr class="section-divider">
                <h2 class="section-title">Active Displays</h2>
                <div id="activeDisplays" class="active-displays">
                    <!-- Display cards will be added here dynamically -->
                </div>
            </div>
        </section>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Mockup JavaScript -->
    <script src="/js/pocket-lab-mockup.js"></script>
</body>
</html>
