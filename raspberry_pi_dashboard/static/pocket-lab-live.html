<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Lab Data - Live</title>

    <!-- Bootstrap Icons - LOCAL -->
    <link rel="stylesheet" href="/css/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/pocket-lab-mockup.css">

    <!-- Debug Console -->
    <style>
        #debug-console {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            background: #1a1a1a;
            color: #00ff00;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 10000;
            border-top: 2px solid #00ff00;
        }
        #debug-console .error { color: #ff0000; }
        #debug-console .warning { color: #ffaa00; }
        #debug-console .success { color: #00ff00; }
        #debug-toggle {
            position: fixed;
            bottom: 210px;
            right: 20px;
            z-index: 10001;
            background: #1a1a1a;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 5px 10px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body data-theme="light">
    <!-- Debug Toggle -->
    <button id="debug-toggle" onclick="toggleDebug()">Hide Debug</button>

    <!-- Debug Console -->
    <div id="debug-console"></div>

    <div class="container">
        <!-- Header -->
        <header class="mockup-header">
            <div class="header-content">
                <h1>Pocket Lab Data</h1>
                <p class="subtitle">Live ESP32 sensor data</p>
            </div>
            <button id="themeToggle" class="theme-toggle-btn">
                <i class="bi bi-moon-fill"></i>
                <span>Dark Theme</span>
            </button>
        </header>

        <!-- Step 1: Device Selection View -->
        <section id="deviceSelectionView" class="view active">
            <h2 class="section-title">Select a Pocket Lab</h2>
            <p class="section-description">Choose which device you want to view data from</p>

            <div id="deviceGrid" class="device-grid">
                <!-- Devices will be generated by JS -->
            </div>
        </section>

        <!-- Step 2 & 3: Measurement Selection & Display View -->
        <section id="measurementView" class="view">
            <!-- Selected Device Info -->
            <div class="selected-device-banner">
                <div class="banner-content">
                    <img id="selectedDeviceIcon" src="/images/pocket-lab-icon.png" alt="Pocket Lab" style="width: 48px; height: 48px; object-fit: contain;" />
                    <div>
                        <h3 id="selectedDeviceName">LAB_01</h3>
                    </div>
                </div>
                <button id="changeDeviceBtn" class="btn btn-outline-blue">
                    <i class="bi bi-arrow-left"></i>
                    Change Device
                </button>
            </div>

            <!-- Measurement Type Cards -->
            <h2 class="section-title">Select Measurements to Display</h2>
            <p class="section-description">Click on display options to add sensor visualizations below</p>

            <div class="measurement-grid" id="measurementGrid">
                <!-- Measurement cards will be generated by JS -->
            </div>

            <!-- Active Display Cards -->
            <div id="displaySection" style="display: none;">
                <hr class="section-divider">
                <h2 class="section-title">Active Displays</h2>
                <div id="activeDisplays" class="active-displays">
                    <!-- Display cards will be added here dynamically -->
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="mockup-footer">
        <p>Developed by the Bucharest Applied STEAM Museum</p>
    </footer>

    <!-- Socket.IO Client - LOCAL -->
    <script src="/js/socket.io.min.js"></script>

    <!-- Chart.js - LOCAL - LOAD BEFORE OUR SCRIPT -->
    <script src="/js/chart.min.js"></script>

    <!-- Debug Script -->
    <script>
        // Debug console
        window.debugLog = function(message, type = 'info') {
            const console_el = document.getElementById('debug-console');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : (type === 'warning' ? 'warning' : 'success');
            console_el.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            console_el.scrollTop = console_el.scrollHeight;

            // Also log to browser console
            if (type === 'error') {
                console.error(message);
            } else if (type === 'warning') {
                console.warn(message);
            } else {
                console.log(message);
            }
        };

        function toggleDebug() {
            const console_el = document.getElementById('debug-console');
            const btn = document.getElementById('debug-toggle');
            if (console_el.style.display === 'none') {
                console_el.style.display = 'block';
                btn.textContent = 'Hide Debug';
            } else {
                console_el.style.display = 'none';
                btn.textContent = 'Show Debug';
            }
        }

        // Catch all errors
        window.addEventListener('error', function(e) {
            debugLog(`ERROR: ${e.message} at ${e.filename}:${e.lineno}`, 'error');
        });

        // Check if Chart.js and Socket.IO loaded
        window.addEventListener('DOMContentLoaded', function() {
            if (typeof Chart === 'undefined') {
                debugLog('ERROR: Chart.js failed to load!', 'error');
            } else {
                debugLog('SUCCESS: Chart.js loaded successfully', 'success');
            }

            if (typeof io === 'undefined') {
                debugLog('ERROR: Socket.IO failed to load!', 'error');
            } else {
                debugLog('SUCCESS: Socket.IO loaded successfully', 'success');
            }
        });
    </script>

    <!-- Live JavaScript -->
    <script src="/js/pocket-lab-live.js"></script>
</body>
</html>
